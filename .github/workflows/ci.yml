name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install ruff==0.16.4
      - run: ruff check .

  build:
    name: Build (${{ matrix.artifact }})
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: YearProgress-windows-x64.exe
          - os: macos-latest
            artifact: YearProgress-macos-arm64.zip
          - os: ubuntu-22.04
            artifact: YearProgress-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build executable
        run: pyinstaller --noconfirm YearProgress.spec
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item dist\YearProgress.exe ${{ matrix.artifact }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -qry "../${{ matrix.artifact }}" YearProgress.app
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/YearProgress
          tar -czf "${{ matrix.artifact }}" -C dist YearProgress
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
